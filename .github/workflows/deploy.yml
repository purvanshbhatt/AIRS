name: ci-deploy

on:
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Full Backend Test Suite ─────────────────────────────────────────
  # 659+ assertions — hard block for all downstream jobs.
  test:
    name: "Backend Tests (659+ assertions)"
    runs-on: ubuntu-latest
    env:
      ENV: local
      AUTH_REQUIRED: "false"
      DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full backend test suite
        run: pytest -q --tb=short

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (branch mode)
        working-directory: frontend
        run: |
          npm ci
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            npm run build:staging
          else
            npm run build:production
          fi

  # ─── Job 2: Governance Regression Gate ───────────────────────────────────────
  # 🔐 HARD BLOCK — staging deploy cannot proceed if ANY of these fail.
  # Verifies the Trust Anchor invariants:
  #   ① Deterministic SHA-256 evidence hash computation
  #   ② SOC_VERIFIED state transition integrity
  #   ③ Idempotency barrier (no duplicate provenance rows)
  #   ④ Cross-tenant alert_id namespace isolation
  governance-regression-gate:
    name: "🔐 Governance Regression Gate (staging block)"
    runs-on: ubuntu-latest
    needs: test
    env:
      ENV: local
      AUTH_REQUIRED: "false"
      DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "① Trust Anchor ingestion tests (tests/governance/)"
        run: pytest tests/governance/ -v --tb=short

      - name: "② Telemetry verification tests"
        run: |
          if [ -f tests/test_telemetry_verification.py ]; then
            pytest tests/test_telemetry_verification.py -v --tb=short
          else
            echo "::notice::test_telemetry_verification.py not found — skipping (not yet implemented)"
          fi

      - name: "③ IGVF merge gate check"
        run: |
          if [ -f scripts/check_igvf_gate.py ]; then
            python scripts/check_igvf_gate.py
          fi

      - name: "④ IGVF tests"
        run: pytest tests/test_igvf.py -v --tb=short

      - name: "⑤ Governance CLI validation"
        run: python scripts/validate_governance.py --brief

      - name: "⑥ UI color compliance validation"
        run: python scripts/validate_ui_colors.py

      - name: "🔐 Gate status summary"
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  ✅ Governance Regression Gate: ALL CHECKS PASSED"
          echo "  Staging deploy is AUTHORIZED to proceed."
          echo "══════════════════════════════════════════════════"

  # ─── Job 3: Staging Deploy ────────────────────────────────────────────────
  # ⚠️  STAGING ONLY (dev branch). Production and demo are NOT touched.
  # Requires both test AND governance-regression-gate to pass.
  # Runs Alembic schema migration BEFORE Cloud Run container swap.
  deploy-staging:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: [test, governance-regression-gate]       # ← hard block on gate
    environment: staging
    steps:
      - name: Check staging deploy secrets
        id: staging_secrets
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ] && [ -n "${{ secrets.GCP_PROJECT_ID }}" ] && [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.staging_secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        if: steps.staging_secrets.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        if: steps.staging_secrets.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Python (for migration)
        if: steps.staging_secrets.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip (migration)
        if: steps.staging_secrets.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python deps (for migration)
        if: steps.staging_secrets.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Alembic Schema Migration ─────────────────────────────────────────
      # Runs BEFORE the Cloud Run container swap to prevent serving a new
      # container revision against an un-migrated schema.
      # Uses Cloud SQL Auth Proxy for secure private IP connectivity.
      - name: Install Cloud SQL Auth Proxy
        if: steps.staging_secrets.outputs.ready == 'true' && env.STAGING_DB_CONNECTION_NAME != ''
        env:
          STAGING_DB_CONNECTION_NAME: ${{ secrets.STAGING_DB_CONNECTION_NAME }}
        run: |
          curl -fsSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64 \
            -o cloud-sql-proxy
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy (staging)
        id: cloud_sql_proxy
        if: steps.staging_secrets.outputs.ready == 'true' && env.STAGING_DB_CONNECTION_NAME != ''
        env:
          STAGING_DB_CONNECTION_NAME: ${{ secrets.STAGING_DB_CONNECTION_NAME }}
        run: |
          ./cloud-sql-proxy \
            --port 5432 \
            "$STAGING_DB_CONNECTION_NAME" &
          echo "proxy_pid=$!" >> "$GITHUB_OUTPUT"
          # Wait for proxy to be ready
          sleep 4
          echo "Cloud SQL Auth Proxy started (PID: $!)"

      - name: "🗄️ Alembic schema migration — staging"
        if: steps.staging_secrets.outputs.ready == 'true'
        env:
          ENV: staging
          AUTH_REQUIRED: "false"
          DEMO_MODE: "false"
          # If STAGING_DATABASE_URL is set (Cloud SQL), it takes priority.
          # Falls back to SQLite on-disk which matches the Cloud Run runtime.
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          echo "════════════════════════════════════════════════"
          echo "  🗄️  Running Alembic migration — STAGING ONLY"
          echo "  Branch: $GITHUB_REF_NAME"
          echo "  Target: airs-api-staging (Cloud SQL)"
          echo "════════════════════════════════════════════════"

          # Show current revision before migration
          python -m alembic current 2>&1 || echo "(no current revision — fresh DB)"

          # Dry-run check: fail fast if migration would break
          python -m alembic upgrade head --sql 2>&1 | head -40

          # Apply migration
          python -m alembic upgrade head

          echo "✅ Migration applied successfully."

          # Verify the control_rule_registry table exists post-migration
          python scripts/verify_staging_migration.py

      - name: Stop Cloud SQL Auth Proxy
        if: always() && steps.cloud_sql_proxy.outputs.proxy_pid != ''
        run: |
          kill ${{ steps.cloud_sql_proxy.outputs.proxy_pid }} 2>/dev/null || true

      # ── Cloud Run Deploy ─────────────────────────────────────────────────
      - name: Deploy backend staging
        if: steps.staging_secrets.outputs.ready == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STAGING_SECRETS: ${{ secrets.GCP_STAGING_SECRET_BINDINGS }}
        run: |
          ARGS=(--target staging --region us-central1 --project "$PROJECT_ID")
          if [ -n "$STAGING_SECRETS" ]; then
            ARGS+=(--set-secrets "$STAGING_SECRETS")
          fi
          bash ./scripts/deploy_cloud_run.sh "${ARGS[@]}"

      - name: Setup Node
        if: steps.staging_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend staging
        if: steps.staging_secrets.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build:staging

      - name: Deploy frontend staging
        if: steps.staging_secrets.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          npm i -g firebase-tools
          firebase deploy --project "$GCP_PROJECT_ID" --only hosting:staging --token "$FIREBASE_TOKEN"

      - name: Skip staging deploy (missing secrets)
        if: steps.staging_secrets.outputs.ready != 'true'
        run: |
          echo "Skipping staging deploy because one or more required secrets are not configured."
          echo "Required: GCP_SA_KEY, GCP_PROJECT_ID, FIREBASE_TOKEN"
          echo "Optional: STAGING_DATABASE_URL, STAGING_DB_CONNECTION_NAME (for Cloud SQL migration)"

  compliance-verified:
    name: Compliance-Verified Status Check
    runs-on: ubuntu-latest
    needs: governance-validation
    env:
      ENV: local
      AUTH_REQUIRED: "false"
      DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Compliance Status
        run: |
          echo "Verifying compliance status of code and organization governance..."
          python scripts/validate_governance.py --brief

  deploy-production:
    # ╔═══════════════════════════════════════════════════════════════════════╗
    # ║  🔒 DEMO IS FROZEN — MANUAL APPROVAL REQUIRED                         ║
    # ║                                                                       ║
    # ║  Production environment is demo mode (ENV=demo, DEMO_MODE=true).     ║
    # ║  All write endpoints return 403 Forbidden in demo mode.              ║
    # ║  Synthetic demo data is frozen for investor presentations.           ║
    # ║                                                                       ║
    # ║  DEPLOYMENT RULES:                                                    ║
    # ║  • Requires "Lead Engineer Approval" via GitHub environment          ║
    # ║  • Only deploy for: security fixes, critical bugs, roadmap updates   ║
    # ║  • NEVER deploy data-modifying changes to demo                        ║
    # ╚═══════════════════════════════════════════════════════════════════════╝
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: [governance-validation, compliance-verified]
    environment: 
      name: production
      # GitHub will require manual approval from designated reviewers
      # Configure "Required reviewers" in Settings > Environments > production
    steps:
      - name: 🛡️ Confirm Demo Deployment Intent
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  ⚠️  DEPLOYING TO DEMO ENVIRONMENT"
          echo "  Target: gen-lang-client-0384513977 (frozen)"
          echo "  Branch: main"
          echo "  All write endpoints will return 403 Forbidden."
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "This deployment was approved via GitHub Environment protection."

      - name: Check production deploy secrets
        id: prod_secrets
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ] && [ -n "${{ secrets.GCP_PROJECT_ID }}" ] && [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.prod_secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        if: steps.prod_secrets.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        if: steps.prod_secrets.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend production
        if: steps.prod_secrets.outputs.ready == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PROD_SECRETS: ${{ secrets.GCP_PROD_SECRET_BINDINGS }}
        run: |
          ARGS=(--service airs-api --region us-central1 --env-file gcp/env.prod.yaml --project "$PROJECT_ID" --prod)
          if [ -n "$PROD_SECRETS" ]; then
            ARGS+=(--set-secrets "$PROD_SECRETS")
          fi
          bash ./scripts/deploy_cloud_run.sh "${ARGS[@]}"

      - name: Setup Node
        if: steps.prod_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend production & demo
        if: steps.prod_secrets.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build:production
          npm run build:demo

      - name: Deploy frontend production & demo
        if: steps.prod_secrets.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          npm i -g firebase-tools
          firebase deploy --project "$GCP_PROJECT_ID" --only hosting:marketing,hosting:demo --token "$FIREBASE_TOKEN"

      - name: Skip production deploy (missing secrets)
        if: steps.prod_secrets.outputs.ready != 'true'
        run: |
          echo "Skipping production deploy because one or more required secrets are not configured."
