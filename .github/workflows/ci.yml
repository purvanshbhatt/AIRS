name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  # ─── Job 1: Backend Tests ─────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (659+ assertions)
    runs-on: ubuntu-latest
    env:
      ENV: local
      AUTH_REQUIRED: "false"
      DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: pytest -q --tb=short
        
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/

  # ─── Job 2: Governance Regression Gate ───────────────────────────────────
  # This is the Trust Anchor gate. All 6 governance tests must pass before
  # any deployment proceeds. These tests verify:
  #   - Deterministic SHA-256 evidence hash computation
  #   - SOC_VERIFIED state transition integrity
  #   - Idempotency barrier (no duplicate provenance records)
  #   - Cross-tenant isolation of alert_id namespaces
  governance-regression-gate:
    name: "🔐 Governance Regression Gate"
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      ENV: local
      AUTH_REQUIRED: "false"
      DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Run governance ingestion tests"
        run: pytest tests/governance/ -v --tb=short

      - name: "Run telemetry verification tests"
        run: pytest tests/test_telemetry_verification.py -v --tb=short

      - name: Run IGVF tests
        run: pytest tests/test_igvf.py -v --tb=short

      - name: Run governance CLI validation
        run: python scripts/validate_governance.py --brief

      - name: Run UI color compliance validation
        run: python scripts/validate_ui_colors.py

  # ─── Job 3: Frontend Build ────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build staging
        working-directory: frontend
        run: npm run build:staging

      - name: Build production
        working-directory: frontend
        run: npm run build:production
