name: ResilAI CI Pipeline

on:
  pull_request:
    branches:
      - main
      - release/*
  push:
    branches:
      - main
      - release/*

permissions:
  contents: read
  security-events: write

jobs:
  # ─── Job 1: Lint & Code Standards ──────────────────────────────────────────
  lint:
    name: Lint & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check app/ tests/ --ignore E501 || true

  # ─── Job 2: Dependency & Security Scan ─────────────────────────────────────
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Tools
        run: |
          pip install bandit safety

      - name: Run Bandit Security Audit
        run: bandit -r app/ -ll -ii --exclude app/tests || true

  # ─── Job 3: Backend Tests ─────────────────────────────────────────────────
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    env:
      ENV: local
      AUTH_REQUIRED: "false"
      DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest -q --tb=short || true

  # ─── Job 4: Frontend Tests & Build ────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Build staging target
        working-directory: frontend
        run: npm run build:staging

      - name: Build production target
        working-directory: frontend
        run: npm run build:production

  # ─── Job 5: Docker Container Build Check ──────────────────────────────────
  docker-check:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: resilai/api:ci-test
