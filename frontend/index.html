    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('resilai-theme') || localStorage.getItem('airs-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const shouldUseDark =
            savedTheme === 'dark' ||
            ((savedTheme === 'system' || savedTheme === null) && prefersDark);

          if (shouldUseDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch {
          document.documentElement.classList.remove('dark');
        }
      })();
