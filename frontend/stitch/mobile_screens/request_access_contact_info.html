<div class="flex flex-col gap-2">
<h1 class="font-headline-lg text-headline-lg hidden md:block text-on-surface">Begin Your Readiness Journey</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:hidden text-on-surface">Begin Your Readiness Journey</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Establish secure executive access to your clinic's security posture.</p>
</div>
</header>
<!-- Progress Indicator -->
<div class="flex items-center justify-center gap-3">
<div class="w-8 h-1 rounded-full bg-primary shadow-[0_0_8px_rgba(78,222,163,0.3)]"></div>
<div class="w-8 h-1 rounded-full bg-surface-container-high"></div>

</div>
<!-- Form Card -->
<div class="bg-surface-container-low rounded-xl border border-surface-container-highest p-unit-lg shadow-2xl relative overflow-hidden">
<!-- Inner Glow -->
<div class="absolute inset-0 pointer-events-none rounded-xl border border-clinical-white/5"></div>
<form class="flex flex-col gap-6">
<!-- Step Title -->
<div class="flex flex-col gap-1 border-b border-surface-container-highest pb-4">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Step 1 of 3</span>
<h2 class="font-title-md text-title-md text-on-surface">Contact Information</h2>
</div>
<!-- Input Fields -->
<div class="flex flex-col gap-4">
<!-- Full Name -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="fullName">FULL NAME</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded text-on-surface font-body-md text-body-md pl-10 pr-4 py-3 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="fullName" name="fullName" placeholder="Dr. Jane Doe" type="text"/>
</div>
</div>
<!-- Professional Email -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">PROFESSIONAL EMAIL</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded text-on-surface font-body-md text-body-md pl-10 pr-4 py-3 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="email" name="email" placeholder="jane.doe@clinic.com" type="email"/>
</div>
</div>

<label class="font-label-sm text-label-sm text-on-surface-variant" for="role">PRIMARY ROLE</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">badge</span>

<option class="text-outline" disabled="" selected="" value="">Select your role...</option>
<option value="ciso">Chief Information Security Officer</option>
<option value="cio">Chief Information Officer</option>
<option value="medical_director">Medical Director</option>
<option value="it_admin">IT Administrator</option>
<option value="other">Other Executive</option>
</select>

</div>
