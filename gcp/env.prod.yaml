# AIRS Production Environment Variables (YAML format for Cloud Run)
# This is the PRODUCTION environment for resilai.org

ENV: "prod"
APP_NAME: "ResilAI"
DEBUG: "false"
GCP_PROJECT_ID: "gen-lang-client-0384513977"

# No DATABASE_URL — Firestore is the ONLY persistence layer.
# SQLite is created on startup as an in-memory cache, synced from Firestore.

CORS_ALLOW_ORIGINS: "https://resilai.org,https://www.resilai.org,https://staging.resilai.org,https://www.staging.resilai.org,https://demo.resilai.org,https://console.resilai.org,https://resilai-marketing.web.app,https://resilai-marketing.firebaseapp.com,https://gen-lang-client-0384513977.web.app,https://gen-lang-client-0384513977.firebaseapp.com,https://airs-staging-0384513977.web.app,https://airs-staging-0384513977.firebaseapp.com"

# Demo mode disabled for production
DEMO_MODE: "false"

AIRS_USE_LLM: "true"
LLM_PROVIDER: "gemini"
LLM_MODEL: "gemini-3-flash"
AUTH_REQUIRED: "true"

# Field-level encryption key — stored in Google Secret Manager / Cloud KMS
# ENCRYPTION_SECRET: "<set via Secret Manager>"

# Secure GCS bucket for compliance exports
COMPLIANCE_GCS_BUCKET: "resilai-audit-ledgers-prod"
