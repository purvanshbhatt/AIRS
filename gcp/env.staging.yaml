# AIRS Staging Environment Variables (YAML for Cloud Run — staging infra)
# This is the ACTIVE DEVELOPMENT environment for new features.
# All development happens here before going to demo.

ENV: "staging"
APP_NAME: "ResilAI"
DEBUG: "false"
GCP_PROJECT_ID: "gen-lang-client-0384513977"

# No DATABASE_URL — Firestore is the ONLY persistence layer.
# SQLite is created on startup as an in-memory cache, synced from Firestore.

CLOUD_RUN_SERVICE_URL: "https://airs-api-staging-knu3wsxymq-uc.a.run.app"
API_BASE_URL: "https://airs-api-staging-knu3wsxymq-uc.a.run.app"

# Set to your staging frontend URL(s)
CORS_ALLOW_ORIGINS: "https://staging.resilai.org,https://www.staging.resilai.org,https://resilai.org,https://www.resilai.org,https://demo.resilai.org,https://resilai-staging.web.app,https://resilai-staging.firebaseapp.com,https://airs-staging-0384513977.web.app,https://airs-staging-0384513977.firebaseapp.com,https://airs-api-staging-knu3wsxymq-uc.a.run.app,http://localhost:5173"

AUTH_REQUIRED: "true"
DEMO_MODE: "false"
AIRS_USE_LLM: "true"
LLM_PROVIDER: "gemini"
LLM_MODEL: "gemini-3-flash"

# Field-level encryption key — stored in Google Secret Manager
# Generate: python -c "from app.core.security.encryption import generate_encryption_key; print(generate_encryption_key())"
ENCRYPTION_SECRET: "fXcv88k7vuypuY-n_hVNB23jyzsSaFX4pMTF7Il3jrs="
# Secure GCS bucket for compliance exports
COMPLIANCE_GCS_BUCKET: "resilai-audit-ledgers-staging"
FORWARDED_ALLOW_IPS: "*"

# Splunk MCP Server (single backend Splunk path per 2026-07-15 audit).
# The SplunkConnector + SplunkMCPClient read these on startup.
# In production these come from Secret Manager bindings.
SPLUNK_MCP_URL: "https://splunk-mcp.air-staging.internal:8090"
SPLUNK_MCP_API_KEY: "replace-via-secret-manager"
